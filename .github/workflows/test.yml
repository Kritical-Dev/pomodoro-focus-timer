name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suites' own watchdogs catch a frozen main thread; this bounds the
    # whole job in case something hangs before a watchdog is reached.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # jsdom 30 requires Node >= 22 (its bundled undici uses a newer Node
      # API), so this is the floor the suite is verified against.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # build.mjs has no dependencies and is deterministic, so a diff here
      # means the committed userscript was not rebuilt after a source change.
      # The version comes from package.json, so that cannot drift either.
      - name: Rebuild and verify the committed userscript is up to date
        run: |
          npm run build
          git diff --exit-code -- pomodoro.user.js

      - name: Lint (sources, tests and the built userscript)
        run: npm run lint

      - name: Unit + jsdom smoke tests
        run: npm test

      # Uses the Chrome preinstalled on the runner — no browser download.
      - name: Real-browser tests
        run: npm run test:e2e
